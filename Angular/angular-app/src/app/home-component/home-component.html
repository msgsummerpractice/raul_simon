      <div class="flex items-center gap-2 sm:gap-4 ml-4">

        <a>

          </button>
        </a>
        <a>
          <button mat-icon-button (click)="logout()">

  <h1 class="text-cyan-400 text-center text-3xl font-bold text-gray-900 p-2">Dog Gallery</h1>
  <p class="text-cyan-400 text-sm text-center p-1 text-black-500">
    This gallery showcases three dog breed cards
  </p>

  <div class="max-w-6xl mx-auto p-6">
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 p-6">
      @for (image of dogImages(); track $index) {
        <div class="bg-teal-400 rounded-lg shadow p-6 shadow-md">
          <img [src]="image" alt="Dog" class="w-full h-64 object-cover rounded" />
          <p class="text-gray-600 text-sm mt-2">A very cute dog.</p>
        </div>
      }
    </div>
    <button mat-raised-button color="primary" class="shadow-lg" (click)="loadDogImages()">
      Fetch Dog Images
    </button>
